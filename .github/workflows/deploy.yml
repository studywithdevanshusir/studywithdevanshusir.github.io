name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Minifier
        run: npm install -g html-minifier-terser

      - name: Minify HTML
        run: |
          find . -name "*.html" -exec html-minifier-terser \
          --collapse-whitespace \
          --remove-comments \
          --minify-css true \
          --minify-js true \
          -o {} {} \;

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: studywithdevanshusir/studywithdevanshusir.github.io
          publish_branch: main
          publish_dir: ./

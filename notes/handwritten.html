    <style>
        /* Handwritten Specific Styles */
        body {
            /* Texture overlay handled by CSS, but we can enhance specific sections */
            background-color: #0f172a;
        }

        .paper-texture {
            background-image: linear-gradient(#1e293b 1px, transparent 1px), linear-gradient(90deg, #1e293b 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .gallery-item {
            position: relative;
            background: #fff;
            padding: 1rem;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transform: rotate(-2deg);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:nth-child(even) {
            transform: rotate(2deg);
        }

        .gallery-item:hover {
            transform: rotate(0) scale(1.05);
            z-index: 10;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .gallery-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 2px solid #eee;
            margin-bottom: 0.5rem;
            filter: sepia(0.2);
        }

        .gallery-caption {
            color: #333;
            font-family: 'Patrick Hand', cursive, sans-serif;
            /* Fallback if not loaded */
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10002;
            padding: 2rem;
        }

        .lightbox.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .close-lightbox {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            z-index: 10003;
        }

        /* Paper Font */
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
    </style>
    
    <script>
        window.dataLayer = window.dataLayer || [];

</head>

        </div>
    </header>

    <!-- CONTENT -->
    <section class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 4rem;">

        <div class="paper-texture" style="padding: 2rem; border-radius: 1rem; margin-top: 2rem;">
            <h2
                style="color: white; text-align: center; margin-bottom: 2rem; font-family: 'Patrick Hand', cursive; font-size: 2.5rem;">
                My Notebook Collection
            </h2>

            <div class="gallery-grid" data-aos="fade-up">
                <!-- Gallery Item 1 -->
                <div class="gallery-item"
                    onclick="openLightbox('../assets/images/notes/handwritten_1.jpg', 'Chapter 1: Python Basics')">

                        style="height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;">
                        <i class="fas fa-pen-fancy" style="font-size: 3rem; color: #cbd5e1;"></i>

                <!-- Gallery Item 2 -->
                <div class="gallery-item"
                    onclick="openLightbox('../assets/images/notes/handwritten_2.jpg', 'Chapter 5: SQL Commands')">
                    <div
                        style="height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;">
                        <i class="fas fa-database" style="font-size: 3rem; color: #cbd5e1;"></i>
                    </div>
                    <div class="gallery-caption">SQL Commands (XII)</div>
                </div>

                <!-- Gallery Item 3 -->
                <div class="gallery-item"

                    <div
                        style="height: 200px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem;">

        </div>

    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
        <img src="" alt="Note Preview" class="lightbox-content" id="lightboxImg">
        <div id="lightboxCaption"
            style="position: absolute; bottom: 30px; color: white; font-size: 1.5rem; font-family: 'Patrick Hand', cursive;">
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Lightbox Logic
        function openLightbox(src, caption) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const cap = document.getElementById('lightboxCaption');

            // For demo purposes, if image doesn't exist, show a placeholder alert
            // In real usage, src would be valid.
            // img.src = src; 
            // We will use a placeholder service if actual image is missing
            img.src = "https://via.placeholder.com/800x1000/1e293b/ffffff?text=Handwritten+Note+Preview";

            cap.innerText = caption;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });
    </script>
    <script src="../assets/js/navigation.js"></script>

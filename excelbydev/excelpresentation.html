<style>
        /* --- GLOBAL VARIABLES & RESET --- */
        :root {
            --bg-color: #fdfdfd;
            /* Very light grey */
            --header-blue: #1F4BD8;
            --excel-green: #107C41;
            --formula-text: #006400;
            /* Dark Green */
            --warning-red: #D13438;
            --practice-bg: #fffbe6;
            /* Light Yellow */
            --text-main: #333333;
            --font-title: 'Segoe UI', Calibri, sans-serif;
            --font-body: 'Calibri', 'Segoe UI', sans-serif;
            --font-code: 'Consolas', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #222;
            font-family: var(--font-body);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        /* --- SLIDE CONTAINER (16:9 Aspect Ratio) --- */
        #slide-stage {
            width: 1280px;
            height: 720px;
            background: var(--bg-color);
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER BAR --- */
        .header-bar {
            background-color: var(--header-blue);
            height: 15px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .slide-content {
            padding: 60px 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: var(--font-title);
            font-size: 44px;
            color: var(--header-blue);
            margin-bottom: 30px;
            font-weight: 600;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p,
        li {
            font-size: 28px;
            line-height: 1.5;
            margin-bottom: 15px;
            list-style-position: inside;
        }

        .formula {
            font-family: var(--font-code);
            font-size: 32px;
            font-weight: bold;
            color: var(--formula-text);
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .warning {
            color: var(--warning-red);
            font-weight: bold;
        }

        .highlight {
            color: var(--header-blue);
            font-weight: bold;
        }

        /* --- ANIMATION CLASSES --- */
        .anim-element {
            opacity: 0;
            transition: all 0.5s ease;
        }

        .visible {
            opacity: 1;
        }

        .fade-in {
            animation: fadeIn 0.5s forwards;
        }

        .wipe-left {
            animation: wipeLeft 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .zoom-in {
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .slide-up {
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes wipeLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- EXCEL SIMULATION GRID --- */
        .excel-ui {
            border: 1px solid #ccc;
            font-family: 'Segoe UI', sans-serif;
            background: #fff;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .excel-ribbon {
            background: #f3f2f1;
            height: 40px;
            border-bottom: 1px solid #e1dfdd;
            display: flex;
            align-items: center;
            padding: 0 10px;
            color: #333;
            font-size: 14px;
        }

        .excel-formula-bar {
            background: #fff;
            height: 30px;
            border-bottom: 1px solid #e1dfdd;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-family: 'Consolas', monospace;
        }

        table.excel-grid {
            width: 100%;
            border-collapse: collapse;
        }

        .excel-grid th {
            background: #e6f3eb;
            border: 1px solid #d4d4d4;
            padding: 10px;
            text-align: center;
            color: var(--excel-green);
            font-weight: 600;
            width: 60px;
        }

        .excel-grid td {
            border: 1px solid #d4d4d4;
            padding: 15px;
            text-align: center;
            position: relative;
            font-size: 24px;
            height: 60px;
        }

        .cell-active {
            border: 3px solid var(--excel-green) !important;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 10px rgba(16, 124, 65, 0.3);
        }

        .cell-active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 8px;
            height: 8px;
            background: var(--excel-green);
        }

        /* Handle */

        /* --- PRACTICE SLIDE STYLE --- */
        .practice-slide {
            background-color: var(--practice-bg) !important;
        }

        .practice-timer {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: #d46b08;
            font-weight: bold;
        }

        /* --- TRAINER NOTES OVERLAY --- */
        #trainer-notes {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 20px;
            font-size: 20px;
            display: none;
            z-index: 100;
            border-top: 4px solid var(--header-blue);
        }

        /* --- CONTROLS --- */
        .controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #555;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>

            },

            },

            // --- MODULE 7: PRINTING ---
            {

            },
            {
                type: "list",
                title: "The Solution: Scale to Fit",
                content: ["Page Layout Tab.", "Width: 1 Page.", "Excel shrinks everything to fit automatically."],
                notes: "This is the magic button for printing.",
                animType: "wipe"
            },
            {
                type: "list",
                title: "Protect Your Sheet",
                content: ["Review -> Protect Sheet.", "Set a Password.", "Now students can't change their marks!"],
                notes: "Essential for security.",

            // --- CONCLUSION ---
            {
                type: "intro",
                title: "Congratulations!",
                content: ["You are now an Excel Hero.", "Practice makes perfect.", "Thank You!"],
                notes: "End on a high note.",
                animType: "zoom"

        // ==========================================
        // ENGINE
        // ==========================================
        let currentSlide = 0;
        let currentStep = 0; // For animations within slide

        const container = document.getElementById('slide-container');
        const noteText = document.getElementById('note-text');
        const trainerNotes = document.getElementById('trainer-notes');

        function renderSlide(index) {
            const slide = slides[index];
            container.innerHTML = ''; // Clear previous
            noteText.textContent = slide.notes || "No notes.";
            currentStep = 0;

            // Slide Title
            const h1 = document.createElement('h1');
            h1.textContent = slide.title;
            h1.className = 'anim-element fade-in';
            container.appendChild(h1);

            // Slide Background logic
            if (slide.type === 'practice') {
                container.parentElement.classList.add('practice-slide');
            } else {
                container.parentElement.classList.remove('practice-slide');
            }

            // Content Rendering Logic
            const contentDiv = document.createElement('div');
            contentDiv.style.flex = "1";
            contentDiv.style.position = "relative";

            if (slide.type === 'list' || slide.type === 'intro' || slide.type === 'practice') {
                const ul = document.createElement('ul');
                slide.content.forEach(text => {
                    const li = document.createElement('li');
                    li.innerHTML = text; // allow html
                    li.className = 'anim-element';
                    li.style.opacity = '0'; // Start hidden
                    ul.appendChild(li);
                });
                contentDiv.appendChild(ul);
            }
            else if (slide.type === 'formula_demo') {
                contentDiv.innerHTML = `
                <p class="anim-element" style="opacity:0"><strong>Action:</strong> ${slide.step}</p>
                <div class="excel-ui anim-element" style="opacity:0">
                    <div class="excel-ribbon">Home | Insert | Page Layout | Formulas</div>
                    <div class="excel-formula-bar"><span style="color:#666">fx</span> &nbsp; <span id="formula-target"></span></div>
                    <table class="excel-grid">
                        <tr><th></th><th>C</th><th>D</th><th>E</th></tr>
                        <tr><th>2</th><td>80</td><td>70</td><td class="cell-active" id="result-cell"></td></tr>
                    </table>
                </div>
                <div id="final-result" class="anim-element" style="opacity:0; margin-top:20px; font-size:40px; color:green; text-align:center;">
                    Result: ${slide.result} 🎉
                </div>
            `;
            }
            else if (slide.type === 'demo' || slide.type === 'anatomy') {
                // Mock Grid
                let gridHtml = '';
                if (slide.grid) {
                    gridHtml = `
                 <table class="excel-grid" style="margin-top:20px;">
                    <tr><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
                    <tr><th>1</th><td>${slide.grid.headers ? slide.grid.headers[0] : ''}</td><td>${slide.grid.headers ? slide.grid.headers[1] : ''}</td><td>${slide.grid.headers ? slide.grid.headers[2] : ''}</td><td>${slide.grid.headers ? slide.grid.headers[3] : ''}</td></tr>
                    <tr><th>2</th><td>${slide.grid.active === 'A1' ? '<b>|</b>' : ''}</td><td></td><td></td><td></td></tr>
                 </table>`;
                }

                const ul = document.createElement('ul');
                slide.content.forEach(text => {
                    const li = document.createElement('li');
                    li.innerHTML = text;
                    li.className = 'anim-element';
                    li.style.opacity = '0';
                    ul.appendChild(li);
                });
                contentDiv.appendChild(ul);
                contentDiv.innerHTML += gridHtml;
            }
            else if (slide.type === 'logic_split') {
                contentDiv.innerHTML = `
                <div style="display:flex; height:100%; gap:50px;">
                    <div style="flex:1; background:#e6f7ff; padding:20px; border-radius:10px;" class="anim-element" style="opacity:0">
                        <h3 style="color:#0050b3">Real Life</h3>
                        <ul>${slide.left.map(l => `<li>${l}</li>`).join('')}</ul>
                    </div>
                    <div style="flex:1; background:#f6ffed; padding:20px; border-radius:10px;" class="anim-element" style="opacity:0">
                        <h3 style="color:#389e0d">Excel Formula</h3>
                        <div class="formula">${slide.right[0]}</div>
                    </div>
                </div>
            `;
            }

            container.appendChild(contentDiv);
        }

        // ==========================================
        // ANIMATION CONTROLLER
        // ==========================================
        function nextStep() {
            const slide = slides[currentSlide];
            const elements = document.querySelectorAll('.anim-element');

            if (currentStep < elements.length) {
                const el = elements[currentStep];

                // Apply specific animation class based on slide config
                if (slide.type === 'formula_demo' && currentStep === 1) {
                    // Special Formula Typing Animation
                    el.classList.add('visible');
                    typeWriter(slide.formula, document.getElementById('formula-target'));
                }
                else if (slide.type === 'formula_demo' && currentStep === 2) {
                    // Result appear
                    el.classList.add('zoom-in');
                    el.style.opacity = 1;
                    document.getElementById('result-cell').innerText = slide.result;
                }
                else {
                    // Standard animations
                    el.style.opacity = 1;
                    if (slide.animType === 'wipe') el.classList.add('wipe-left');
                    else if (slide.animType === 'zoom') el.classList.add('zoom-in');
                    else if (slide.animType === 'slide') el.classList.add('slide-up');
                    else el.classList.add('fade-in');
                }

                currentStep++;
            } else {
                // Next Slide
                if (currentSlide < slides.length - 1) {
                    currentSlide++;
                    renderSlide(currentSlide);
                }
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide);
            }
        }

        function typeWriter(text, element) {
            let i = 0;
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }

        // ==========================================
        // EVENTS
        // ==========================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextStep();
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 't' || e.key === 'T') {
                trainerNotes.style.display = trainerNotes.style.display === 'block' ? 'none' : 'block';
            }
        });

        document.addEventListener('click', nextStep);

        // Initial Render
        renderSlide(0);

    </script>
</body>

</html>
